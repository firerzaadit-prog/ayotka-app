name: Deploy ayotka.id to VPS
on:
  push:
    branches: [ main, claude/fase-1-github-setup-8ttlac ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            echo ">>> Masuk ke direktori ayotka-app..."
            cd /var/www/ayotka-app

            echo ">>> Mengambil kode terbaru dari GitHub..."
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            echo ">>> Install dependencies & Prisma generate..."
            npm install --prefer-offline
            npx prisma generate

            echo ">>> Build aplikasi Next.js..."
            npm run build

            echo ">>> Reload PM2 zero-downtime..."
            pm2 reload ayotka-app

            echo ">>> Deploy ayotka.id selesai dengan sukses!"
