# Potongan konfigurasi nginx untuk self-host AyoTKA.
# Pasang di /etc/nginx/snippets/ayotka-selfhost.conf, lalu di dalam blok `server { ... }` yang melayani ayotka.id
# (yang ada `listen 443 ssl`), TEPAT SEBELUM `location / {`, tambahkan satu baris:
#
#       include /etc/nginx/snippets/ayotka-selfhost.conf;
#
# Lalu: sudo nginx -t && sudo systemctl reload nginx
# Panduan lengkap: README.md, bagian "Langkah nginx".

# --- Login (GoTrue di container, port 9999 hanya di 127.0.0.1) ---------------------------------------------------
# supabase-js memanggil <NEXT_PUBLIC_SUPABASE_URL>/auth/v1/...; di sini awalan /supabase/auth/v1/ dipotong dan sisanya
# diteruskan ke GoTrue (proxy_pass dengan URI "/" di ujungnya).

# API admin (buat/hapus akun, generate_link): hanya boleh dari server ini sendiri (aplikasi memanggilnya lewat alamat
# publik, jadi sumbernya IP publik server), TIDAK dari internet. Kunci service tetap diperlukan; ini lapisan tambahan.
location ^~ /supabase/auth/v1/admin/ {
    allow 127.0.0.1;
    allow 187.77.115.29;
    deny all;

    proxy_pass http://127.0.0.1:9999/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location ^~ /supabase/auth/v1/ {
    proxy_pass http://127.0.0.1:9999/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Bagian lain di bawah /supabase/ (rest, storage, dll.) TIDAK disediakan: tidak ada layanannya.
location ^~ /supabase/ {
    return 404;
}

# --- Gambar soal (disimpan aplikasi di disk, bucket "soal-media") -----------------------------------------------
# Berkas statis; nama berkasnya acak/hash sehingga aman di-cache lama dan tidak bisa ditebak.
location ^~ /media/soal-media/ {
    alias /var/www/ayotka-media/soal-media/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
